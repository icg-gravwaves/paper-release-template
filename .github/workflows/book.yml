# Build the Jupyter Book on every push and publish it to GitHub Pages from main.
# Enable Pages in the repository settings with source "GitHub Actions".
name: data-release-site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The notebooks read only plain-git files. If one reads a Git LFS file,
        # uncomment the next two lines; each run then uses LFS bandwidth.
        # with:
        #   lfs: true
      # Build in exactly the environment released with the paper
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Build book (executes the notebooks)
        shell: bash -el {0}
        run: jupyter-book build --warningiserror --keep-going .
      - name: Check main.tex contains the latest tables and numbers
        run: |
          if grep -rl "NOT FOUND in paper/main.tex" _build/jupyter_execute; then
            echo "::error::Paste the updated LaTeX printed by the notebooks above into paper/main.tex"
            exit 1
          fi
      # Compile the paper and publish the PDF with the site, at /paper.pdf,
      # so it can be read without signing in to GitHub and never expires
      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Add the paper PDF to the site
        run: cp paper/main.pdf _build/html/paper.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

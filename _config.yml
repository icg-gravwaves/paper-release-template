# Jupyter Book (v1) configuration for the paper's data release site.
# TEMPLATE: replace the title and authors with your paper's
title: "Reproducible by construction: data release"
author: Your Name, Second Author and Third Author
logo: ""
# TEMPLATE: replace with the copyright year(s) and holder for your release.
# Shown in the site footer as "© Copyright <year>, <holder>".
copyright: "2026, Gareth Cabourn Davies"

# Re-execute every notebook on each build so the published pages always
# match the code. Notebooks that need large data or a cluster can be listed
# in exclude_patterns; their stored outputs are then shown instead.
execute:
  execute_notebooks: force
  timeout: 600
  exclude_patterns: []

exclude_patterns:
  - ".venv"
  - ".github"
  - "_build"
  - "paper"
  - "**.ipynb_checkpoints"

# Only build pages listed in _toc.yml
only_build_toc_files: true

# TEMPLATE: point this at your own repository. The header's GitHub button
# and the per-page source links use repository_url under sphinx: below.
repository:
  url: https://github.com/icg-gravwaves/paper-release-template
  branch: main

sphinx:
  config:
    html_css_files:
      - custom.css
    # Extra page templates; see guide/site_layout.md
    templates_path:
      - _templates
    # Theme settings for the site's navigation, header buttons and footer
    # (see guide/site_layout.md). Setting html_theme_options here replaces
    # the ones Jupyter Book would otherwise derive from an html: section, so
    # all of them are set here instead.
    html_theme_options:
      # TEMPLATE: point these at your own repository
      repository_url: https://github.com/icg-gravwaves/paper-release-template
      repository_branch: main
      path_to_docs: ""
      use_repository_button: true
      # TEMPLATE: replace with your paper's title
      extra_footer: |
        Code and small data products accompanying <em>Reproducible by construction</em>.
      # Search lives in the left sidebar; don't repeat it in the top header bar
      navbar_persistent: []
      # "This page is generated from <file>" at the bottom of every page
      article_footer_items:
        - source-file.html
